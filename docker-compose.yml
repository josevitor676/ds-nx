services:
  dev:
    build:
      context: .
      target: base
    user: 1000:1000
    ports:
      - "6006:6006"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
    command: sh -c "npm install --legacy-peer-deps && npm run storybook -- --host 0.0.0.0 --no-open"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6006"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production